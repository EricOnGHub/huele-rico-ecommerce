cias ni afirmamos estar afiliados con las marcas.","Cómo verificar los productos","Antes de vender inventario real, debemos documentar facturas de proveedores, procedencia, empaques, etiquetas y controles de preparación de pedidos. El código de lote por sí solo no demuestra autenticidad.","Nuestra garantía","La garantía de originalidad y devolución de dinero estará disponible cuando se definan la verificación, los requisitos de devolución y la política de reembolsos. Contáctanos si tienes dudas."]};const locale=localStorage.getItem('huele-lang')==='es'?'es':'en';let lang=locale;function paint(){const a=copy[lang];document.documentElement.lang=lang;document.title=a[0]+' | Huele Rico!';document.getElementById('copy').innerHTML='<p class="eyebrow">HUELE RICO!</p><h1>'+a[0]+'</h1><h2>'+a[1]+'</h2><p>'+a[2]+'</p><h2>'+a[3]+'</h2><p>'+a[4]+'</p><h2>'+a[5]+'</h2><p>'+a[6]+'</p>';localStorage.setItem('huele-lang',lang)}document.getElementById('pageLanguage').onclick=()=>{lang=lang==='en'?'es':'en';paint()};paint();</script></body></html>
